name: desktop
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: microsoft
          java-version: 21
      - run: |
          ./gradlew :app:desktopApp:packageReleaseAppImage --info
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-release-AppImage
          path: app/desktopApp/build/compose/binaries/main-release/app/com.example.template
