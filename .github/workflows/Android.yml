name: Android CI

on:
#  push:
#    branches:
#      - main
  workflow_call:
    # Declare secrets expected from callers so they are forwarded correctly.
    # Callers must provide these in the `secrets:` mapping when using this reusable workflow.
    secrets:
      ANDROID_KEY_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - uses: actions/checkout@v6.0.3
      - run: |
          # Decode the base64 keystore secret into the module directory, where the
          # Kotlin Toolchain signing configuration expects it (storeFile is resolved
          # relative to app/androidApp/). Strip whitespace/newlines first to avoid an
          # empty file when the secret contains newlines or trailing whitespace.
          printf '%s' "${{ secrets.ANDROID_KEY_BASE64 }}" | tr -d ' \t\n\r' | base64 --decode > app/androidApp/release.keystore
          cat > app/androidApp/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
#      - run: |
#          keytool -list -v -keystore app/androidApp/release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
      - run: |
          ./kotlin package -m androidApp
      - uses: actions/upload-artifact@v7.0.1
        with:
            name: android-release-aab
            path: app/androidApp/build/**/*.aab
      - run: |
          rm -f app/androidApp/release.keystore app/androidApp/keystore.properties
