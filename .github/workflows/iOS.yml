name: iOS starter workflow

on:
  workflow_call:

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: iOS release build (simulator)
        run: xcodebuild -project app/iosApp/module.xcodeproj -scheme app -configuration Release -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' CODE_SIGNING_ALLOWED='NO'
      - uses: actions/checkout@v2
      - uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATES_PASSWORD }}
      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: codes.orj.Example-iOS
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      - name: "#️⃣ Generate Build Number"
        id: buildnumber
        uses: einaregilsson/build-number@v2
        with:
          token: ${{ secrets.github_token }}
      - name: Archive release build
        run: |
          xcodebuild \
            -project app/iosApp/module.xcodeproj \
            -scheme app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/release/iosApp.xcarchive \
            -allowProvisioningUpdates \
            archive
      - name: Export archive for App Store upload
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/release/iosApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/release/export \
            -allowProvisioningUpdates
      - uses: Apple-Actions/upload-testflight-build@master
        with:
          app-path: build/release/export/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
